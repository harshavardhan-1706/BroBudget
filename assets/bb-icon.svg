<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="bb-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bb-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bb-icon-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Ambient glow circle -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bb-icon-grad)" opacity="0.35" filter="url(#bb-icon-glow)" />
  <!-- Icon Base -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#0F172A" />
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bb-icon-grad)" opacity="0.22" />
  <rect x="3" y="3" width="58" height="58" rx="17" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <!-- Cash Bill -->
  <g transform="translate(12, 10)">
    <rect x="0" y="0" width="40" height="22" rx="4" fill="#059669" />
    <rect x="1" y="1" width="38" height="20" rx="3" fill="#10B981" />
    <circle cx="20" cy="11" r="5" fill="#ECFDF5" />
    <path d="M20 8.5v5M18.8 9.8c.4-.4 1-.5 1.5-.2.4.3.5.7.2 1.1-.4.3-1 .5-1.5.8-.3.3-.3.7 0 1.1.4.3 1.1.3 1.6 0" fill="none" stroke="#047857" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="5" cy="11" r="1.5" fill="#D1FAE5" />
    <circle cx="35" cy="11" r="1.5" fill="#D1FAE5" />
  </g>
  <!-- BB Letters -->
  <text x="32" y="52" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="url(#bb-icon-text)" letter-spacing="1.5">BB</text>
</svg>
