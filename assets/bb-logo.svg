<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Background and Glow Filters -->
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="bb-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="bb-emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="bb-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="bb-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bb-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container (64x64) -->
  <g transform="translate(8, 8)">
    <!-- Ambient glow circle -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#bb-emblem-grad)" opacity="0.3" filter="url(#bb-glow)" />

    <!-- Glassmorphic Icon Base -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#0F172A" />
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#bb-emblem-grad)" opacity="0.18" />
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" fill="none" stroke="url(#bb-border-grad)" stroke-width="1.5" />

    <!-- Mini Money Bill Symbol 💵 -->
    <g transform="translate(11, 10)">
      <!-- Outer Banknote Silhouette -->
      <rect x="0" y="0" width="42" height="24" rx="4" fill="#059669" opacity="0.85" />
      <rect x="1" y="1" width="40" height="22" rx="3" fill="#10B981" />
      <circle cx="21" cy="12" r="5" fill="#ECFDF5" opacity="0.95" />
      <path d="M21 9.5v5M19.5 10.8c.4-.5 1.2-.6 1.7-.3.5.3.6.8.3 1.2-.4.4-1.2.6-1.7 1-.4.3-.4.8 0 1.2.5.4 1.3.4 1.8 0" fill="none" stroke="#047857" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="5" cy="12" r="1.5" fill="#D1FAE5" />
      <circle cx="37" cy="12" r="1.5" fill="#D1FAE5" />
    </g>

    <!-- Stylized "BB" Monogram -->
    <g transform="translate(13, 38)">
      <text x="0" y="18" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="url(#bb-text-grad)" letter-spacing="1">BB</text>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 26)">
    <!-- Main Name -->
    <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="url(#bb-text-grad)" letter-spacing="-0.5">Bro<tspan fill="#34D399">Budget</tspan></text>
    <!-- Tagline / Subtitle -->
    <text x="1" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" letter-spacing="2.8">PERSONAL WEALTH OS</text>
  </g>
</svg>
